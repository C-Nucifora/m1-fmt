[package]
name = "m1-fmt"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "m1-fmt"
path = "src/main.rs"

[lib]
name = "m1_fmt"
path = "src/lib.rs"

[dependencies]
m1-core = { git = "https://github.com/C-Nucifora/m1-core.git", tag = "v0.7.0" }
m1-workspace = { git = "https://github.com/nedlane/m1-workspace.git", tag = "v0.5.0" }
clap = { version = "4", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3

